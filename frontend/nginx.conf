server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # API 反向代理到后端（保留 /api 前缀，与 Django 路由挂载点一致）
    # 使用变量 + Docker 内置 DNS 延迟解析：后端未启动时 nginx 仍可正常启动，/api 返回 502
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend backend:8000;
        proxy_pass http://$backend;
        # $http_host 保留原始 Host（含端口）：
        # GitLab OIDC 流程中后端需要用它生成与 Redirect URI
        # （http://host:9000/api/oidc/callback）一致的回调地址，
        # 若用 $host（不带端口）会导致 GitLab 校验 redirect_uri 失败
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退；index.html 不缓存
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
