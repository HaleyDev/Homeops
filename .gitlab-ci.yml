# GitLab CI
# Runner: gti-host（跑在部署服务器 192.168.199.123 本机）
#
# 只负责构建镜像并推送到 Harbor，不做部署：
# - push 到 main 自动触发 build-and-push
# - GitLab 页面 Run pipeline 也可手动触发
# 部署由服务器侧自行执行（docker compose pull && docker compose up -d）

stages:
  - build

variables:
  REGISTRY: 192.168.199.123:2233
  BACKEND_IMAGE: $REGISTRY/homeops/homeops-backend:latest
  FRONTEND_IMAGE: $REGISTRY/homeops/homeops-frontend:latest
  GIT_CLEAN_FLAGS: -ffdx -e docker/mysql/

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == "main"

build-and-push:
  stage: build
  tags: [gti-host]
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  script:
    - docker build -f docker/backend/Dockerfile -t $BACKEND_IMAGE backend
    - docker build -f docker/frontend/Dockerfile -t $FRONTEND_IMAGE frontend
    - docker push $BACKEND_IMAGE
    - docker push $FRONTEND_IMAGE
